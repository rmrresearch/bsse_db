<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Water Molecules from CSV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            font-size: 14px;
            max-width: 300px;
        }
        .control-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="color"] {
            width: 40px;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="range"] {
            width: 150px;
        }
        input[type="file"] {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
        }
        #coordinates {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            font-size: 12px;
            font-family: monospace;
            max-width: 250px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }
        button:hover {
            background: #45a049;
        }
        #colorScale {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .color-bar {
            height: 20px;
            background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
            border-radius: 4px;
            margin: 5px 0;
        }
        #loadingStatus {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3>CSV Water Molecules</h3>
            <div class="control-group">
                <label for="csvFile">Load CSV File:</label>
                <input type="file" id="csvFile" accept=".csv" />
                <div id="loadingStatus"></div>
            </div>
            
            <div class="control-group">
                <label for="hydrogen">Hydrogen Color:</label>
                <input type="color" id="hydrogen" value="#ffffff">
            </div>
            
            <div class="control-group">
                <label for="atomSize">Atom Size:</label>
                <input type="range" id="atomSize" min="0.1" max="2" step="0.1" value="0.5">
                <span id="atomSizeValue">0.5</span>
            </div>
            
            <div class="control-group">
                <label for="bondThickness">Bond Thickness:</label>
                <input type="range" id="bondThickness" min="0.01" max="0.2" step="0.01" value="0.05">
                <span id="bondThicknessValue">0.05</span>
            </div>
            
            <div id="colorScale">
                <strong>BSSE_A Viridis Color Scale:</strong>
                <div class="color-bar" style="background: linear-gradient(to right, #440154, #482777, #3f4a8a, #31678e, #26838f, #1f9d8a, #6cce5a, #b6de2b, #fee825);"></div>
                <div style="display: flex; justify-content: space-between; font-size: 11px;">
                    <span id="minBSSE">Min</span>
                    <span id="maxBSSE">Max</span>
                </div>
            </div>
            
            <button onclick="resetView()">Reset View</button>
            <button onclick="loadSampleData()">Load Sample Data</button>
        </div>
        
        <div id="coordinates">
            <h4>Molecule Info</h4>
            <div id="coordDisplay">
                Mouse over atoms to see details
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let atoms = [];
        let bonds = [];
        let raycaster, mouse;
        let axesHelper;
        let moleculeData = [];
        let bsseRange = { min: 0, max: 1 };

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Add coordinate axes
            axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            // Mouse controls
            addOrbitControls();

            // Raycaster for mouse interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Event listeners
            setupEventListeners();

            // Load sample data initially
            loadSampleData();

            // Animation loop
            animate();
        }

        function addOrbitControls() {
            let isMouseDown = false;
            let mouseX = 0, mouseY = 0;
            let rotationX = 0, rotationY = 0;
            let targetRotationX = 0, targetRotationY = 0;
            let radius = 8;
            let targetRadius = 8;

            renderer.domElement.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                mouseX = event.clientX;
                mouseY = event.clientY;
            });

            renderer.domElement.addEventListener('mousemove', (event) => {
                if (isMouseDown) {
                    const deltaX = event.clientX - mouseX;
                    const deltaY = event.clientY - mouseY;
                    
                    targetRotationY += deltaX * 0.01;
                    targetRotationX -= deltaY * 0.01;
                    
                    targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
                    
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                }

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                checkIntersections();
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isMouseDown = false;
            });

            renderer.domElement.addEventListener('wheel', (event) => {
                targetRadius += event.deltaY * 0.01;
                targetRadius = Math.max(2, Math.min(50, targetRadius));
            });

            function updateCamera() {
                rotationX += (targetRotationX - rotationX) * 0.1;
                rotationY += (targetRotationY - rotationY) * 0.1;
                radius += (targetRadius - radius) * 0.1;

                camera.position.x = radius * Math.cos(rotationX) * Math.sin(rotationY);
                camera.position.y = radius * Math.sin(rotationX);
                camera.position.z = radius * Math.cos(rotationX) * Math.cos(rotationY);
                camera.lookAt(0, 0, 0);
            }

            window.updateCamera = updateCamera;
        }

        function getColorFromBSSE(bsseValue) {
            // Normalize BSSE value to 0-1 range
            const normalized = Math.max(0, Math.min(1, (bsseValue - bsseRange.min) / (bsseRange.max - bsseRange.min)));
            
            // Viridis color scale - scientifically designed perceptually uniform colormap
            // Interpolate between key Viridis colors
            const viridisColors = [
                { r: 0.267004, g: 0.004874, b: 0.329415 }, // Dark purple
                { r: 0.282623, g: 0.140926, b: 0.457517 }, // Purple
                { r: 0.253935, g: 0.265254, b: 0.529983 }, // Dark blue
                { r: 0.206756, g: 0.371758, b: 0.553117 }, // Blue
                { r: 0.163625, g: 0.471133, b: 0.558148 }, // Blue-green
                { r: 0.127568, g: 0.566949, b: 0.550556 }, // Teal
                { r: 0.134692, g: 0.658636, b: 0.517649 }, // Green-teal
                { r: 0.266941, g: 0.748751, b: 0.440573 }, // Green
                { r: 0.477504, g: 0.821444, b: 0.318195 }, // Yellow-green
                { r: 0.741388, g: 0.873449, b: 0.149561 }, // Yellow
                { r: 0.993248, g: 0.906157, b: 0.143936 }  // Light yellow
            ];
            
            // Find the appropriate color segment
            const scaledPos = normalized * (viridisColors.length - 1);
            const lowerIndex = Math.floor(scaledPos);
            const upperIndex = Math.min(lowerIndex + 1, viridisColors.length - 1);
            const t = scaledPos - lowerIndex;
            
            // Interpolate between the two colors
            const lowerColor = viridisColors[lowerIndex];
            const upperColor = viridisColors[upperIndex];
            
            const r = lowerColor.r + t * (upperColor.r - lowerColor.r);
            const g = lowerColor.g + t * (upperColor.g - lowerColor.g);
            const b = lowerColor.b + t * (upperColor.b - lowerColor.b);
            
            return new THREE.Color(r, g, b);
        }

        function processCSVData(csvText) {
            const results = Papa.parse(csvText, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true
            });

            if (results.errors.length > 0) {
                console.error('CSV parsing errors:', results.errors);
                document.getElementById('loadingStatus').innerHTML = 'Error parsing CSV file';
                return;
            }

            moleculeData = results.data;
            
            // Calculate BSSE_A range
            const bsseValues = moleculeData.map(row => parseFloat(row.BSSE_A)).filter(val => !isNaN(val));
            bsseRange.min = Math.min(...bsseValues);
            bsseRange.max = Math.max(...bsseValues);
            
            updateColorScale();
            createMoleculesFromData();
            
            document.getElementById('loadingStatus').innerHTML = `Loaded ${moleculeData.length} molecules`;
        }

        function updateColorScale() {
            document.getElementById('minBSSE').textContent = bsseRange.min.toFixed(4);
            document.getElementById('maxBSSE').textContent = bsseRange.max.toFixed(4);
        }

        function createMoleculesFromData() {
            // Clear existing molecules
            clearScene();
            
            moleculeData.forEach((row, index) => {
                try {
                    // Parse coordinates, handling potential undefined values
                    const oxygenCoords = {
                        x: parseFloat(row.x_O) || 0,
                        y: parseFloat(row.y_O) || 0,
                        z: parseFloat(row.z_O) || 0
                    };
                    
                    const h1Coords = {
                        x: parseFloat(row.x_H1) || 0,
                        y: parseFloat(row.y_H1) || 0,
                        z: parseFloat(row.z_H1) || 0
                    };
                    
                    const h2Coords = {
                        x: parseFloat(row.x_H2) || 0,
                        y: parseFloat(row.y_H2) || 0,
                        z: parseFloat(row.z_H2) || 0
                    };
                    
                    const bsseValue = parseFloat(row.BSSE_A) || 0;
                    
                    // Create oxygen atom with BSSE-based color
                    const oxygenColor = getColorFromBSSE(bsseValue);
                    const oxygenGeometry = new THREE.SphereGeometry(0.5, 32, 32);
                    const oxygenMaterial = new THREE.MeshLambertMaterial({ color: oxygenColor });
                    const oxygenSphere = new THREE.Mesh(oxygenGeometry, oxygenMaterial);
                    
                    oxygenSphere.position.set(oxygenCoords.x, oxygenCoords.y, oxygenCoords.z);
                    oxygenSphere.userData = {
                        element: 'O',
                        coords: oxygenCoords,
                        moleculeIndex: index,
                        bsse: bsseValue,
                        originalRow: row
                    };
                    
                    scene.add(oxygenSphere);
                    atoms.push(oxygenSphere);
                    
                    // Create hydrogen atoms
                    const hydrogenColor = new THREE.Color(document.getElementById('hydrogen').value);
                    
                    // Hydrogen 1
                    const h1Geometry = new THREE.SphereGeometry(0.3, 32, 32);
                    const h1Material = new THREE.MeshLambertMaterial({ color: hydrogenColor });
                    const h1Sphere = new THREE.Mesh(h1Geometry, h1Material);
                    
                    h1Sphere.position.set(h1Coords.x, h1Coords.y, h1Coords.z);
                    h1Sphere.userData = {
                        element: 'H1',
                        coords: h1Coords,
                        moleculeIndex: index,
                        originalRow: row
                    };
                    
                    scene.add(h1Sphere);
                    atoms.push(h1Sphere);
                    
                    // Hydrogen 2
                    const h2Geometry = new THREE.SphereGeometry(0.3, 32, 32);
                    const h2Material = new THREE.MeshLambertMaterial({ color: hydrogenColor });
                    const h2Sphere = new THREE.Mesh(h2Geometry, h2Material);
                    
                    h2Sphere.position.set(h2Coords.x, h2Coords.y, h2Coords.z);
                    h2Sphere.userData = {
                        element: 'H2',
                        coords: h2Coords,
                        moleculeIndex: index,
                        originalRow: row
                    };
                    
                    scene.add(h2Sphere);
                    atoms.push(h2Sphere);
                    
                    // Create bonds
                    createBond(oxygenSphere.position, h1Sphere.position);
                    createBond(oxygenSphere.position, h2Sphere.position);
                    
                } catch (error) {
                    console.error(`Error processing molecule ${index}:`, error);
                }
            });
        }

        function createBond(pos1, pos2) {
            const direction = new THREE.Vector3().subVectors(pos2, pos1);
            const length = direction.length();
            const geometry = new THREE.CylinderGeometry(0.05, 0.05, length, 8);
            const material = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const bond = new THREE.Mesh(geometry, material);

            bond.position.copy(pos1).add(pos2).divideScalar(2);
            bond.lookAt(pos2);
            bond.rotateX(Math.PI / 2);

            scene.add(bond);
            bonds.push(bond);
        }

        function clearScene() {
            atoms.forEach(atom => scene.remove(atom));
            bonds.forEach(bond => scene.remove(bond));
            atoms = [];
            bonds = [];
        }

        function checkIntersections() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(atoms);

            if (intersects.length > 0) {
                const atom = intersects[0].object;
                const coords = atom.userData.coords;
                const row = atom.userData.originalRow;
                
                let displayText = `
                    Element: ${atom.userData.element}<br>
                    Molecule: ${atom.userData.moleculeIndex + 1}<br>
                    X: ${coords.x.toFixed(3)}<br>
                    Y: ${coords.y.toFixed(3)}<br>
                    Z: ${coords.z.toFixed(3)}<br>
                `;
                
                if (atom.userData.bsse !== undefined) {
                    displayText += `<br><strong>BSSE_A: ${atom.userData.bsse.toFixed(6)}</strong><br>`;
                }
                
                if (row) {
                    displayText += `<br><small>All coordinates:<br>`;
                    displayText += `O: (${row.x_O}, ${row.y_O}, ${row.z_O})<br>`;
                    displayText += `H1: (${row.x_H1}, ${row.y_H1}, ${row.z_H1})<br>`;
                    displayText += `H2: (${row.x_H2}, ${row.y_H2}, ${row.z_H2})</small>`;
                }
                
                document.getElementById('coordDisplay').innerHTML = displayText;
            }
        }

        function setupEventListeners() {
            // File input
            document.getElementById('csvFile').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        document.getElementById('loadingStatus').innerHTML = 'Processing CSV...';
                        processCSVData(e.target.result);
                    };
                    reader.readAsText(file);
                }
            });
            
            // Color controls
            document.getElementById('hydrogen').addEventListener('change', updateHydrogenColor);
            
            // Size controls
            document.getElementById('atomSize').addEventListener('input', (e) => {
                document.getElementById('atomSizeValue').textContent = e.target.value;
                updateAtomSizes();
            });
            
            document.getElementById('bondThickness').addEventListener('input', (e) => {
                document.getElementById('bondThicknessValue').textContent = e.target.value;
                updateBondThickness();
            });

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function updateHydrogenColor() {
            const color = new THREE.Color(document.getElementById('hydrogen').value);
            atoms.forEach(atom => {
                if (atom.userData.element === 'H1' || atom.userData.element === 'H2') {
                    atom.material.color.copy(color);
                }
            });
        }

        function updateAtomSizes() {
            const scale = parseFloat(document.getElementById('atomSize').value);
            atoms.forEach(atom => {
                atom.scale.setScalar(scale * 2);
            });
        }

        function updateBondThickness() {
            const thickness = parseFloat(document.getElementById('bondThickness').value);
            bonds.forEach(bond => {
                bond.scale.set(thickness * 20, 1, thickness * 20);
            });
        }

        function resetView() {
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);
        }

        function loadSampleData() {
            const sampleCSV = `x,y,z,BSSE_A,x_O,y_O,z_O,x_H1,y_H1,z_H1,x_H2,y_H2,z_H2
0,0,0,-0.0012,0,0,0,0.96,0,0,-0.24,0.93,0
3,1,2,-0.0008,3,1,2,3.96,1,2,2.76,1.93,2
-2,2,-1,-0.0015,-2,2,-1,-1.04,2,-1,-2.24,2.93,-1
1,-1,3,-0.0020,1,-1,3,1.96,-1,3,0.76,-0.07,3
-1,3,1,-0.0005,-1,3,1,-0.04,3,1,-1.24,3.93,1`;
            
            document.getElementById('loadingStatus').innerHTML = 'Loading sample data...';
            processCSVData(sampleCSV);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (window.updateCamera) {
                window.updateCamera();
            }
            renderer.render(scene, camera);
        }

        // Initialize the scene
        init();
    </script>
</body>
</html>
